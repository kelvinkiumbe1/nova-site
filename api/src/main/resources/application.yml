spring:
  application:
    name: nova-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/nova}
    username: ${DB_USER:nova}
    password: ${DB_PASSWORD:nova}
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
      timeout: 8h

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

nova:
  site-url: ${SITE_URL:http://localhost:5173}
  admin:
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}
  quotes:
    notify-email: ${QUOTE_NOTIFY_EMAIL:}
    from-email: ${MAIL_FROM:no-reply@novasitecare.co.ke}
  storage:
    type: ${STORAGE_TYPE:local}          # local | s3 (Cloudflare R2 or any S3-compatible store)
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    s3:
      endpoint: ${S3_ENDPOINT:}           # R2: https://<account-id>.r2.cloudflarestorage.com
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}   # e.g. https://media.novasitecare.co.ke
  turnstile:
    secret: ${TURNSTILE_SECRET:}
